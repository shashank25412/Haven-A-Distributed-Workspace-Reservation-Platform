# -----------------------------------------------------------------------------
# Haven Local
#
# Runs and initializes the Couchbase Server used by native Haven development
# and infrastructure integration tests. The Haven API is built and run on the
# host because the Couchbase C++ SDK is supplied by Homebrew.
# -----------------------------------------------------------------------------

services:
  redis:
    image: redis:7.4.2-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  couchbase:
    image: couchbase/server:community-8.0.2

    ports:
      - "8091-8097:8091-8097"
      - "11210:11210"

    volumes:
      - haven-couchbase-data:/opt/couchbase/var

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8091/ui/index.html"
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  couchbase-init:
    build:
      context: ./deploy/couchbase
    image: haven-couchbase-init:local

    depends_on:
      couchbase:
        condition: service_healthy

    environment:
      HVN_COUCHBASE_USERNAME: "${HVN_COUCHBASE_USERNAME:-Administrator}"
      HVN_COUCHBASE_PASSWORD: "${HVN_COUCHBASE_PASSWORD:-password}"
      HVN_COUCHBASE_BUCKET: "${HVN_COUCHBASE_BUCKET:-haven}"
      HVN_COUCHBASE_SCOPE: "${HVN_COUCHBASE_SCOPE:-reservation}"

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:29092
      - --create
      - --if-not-exists
      - --topic
      - "${HVN_KAFKA_RESERVATION_EVENTS_TOPIC:-haven.reservation.events}"
      - --partitions
      - "1"
      - --replication-factor
      - "1"

volumes:
  haven-couchbase-data:
